name: OrangeLen
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans, Base]
  deploymentTarget:
    macOS: '14.0'
packages:
  OrangeLen:
    path: Packages/OrangeLen
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_DEBUG_DYLIB: NO
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
targets:
  OrangeLen:
    type: application
    platform: macOS
    sources: [App]
    resources:
      - path: docs/licenses
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 OrangeLen contributors
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: local.orangelen.jsonc
            UTTypeDescription: JSON with Comments
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [jsonc]
          - UTTypeIdentifier: local.orangelen.json5
            UTTypeDescription: JSON5 Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [json5]
          - UTTypeIdentifier: local.orangelen.developer-source
            UTTypeDescription: Developer Source and Configuration
            UTTypeConformsTo: [public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [vue, svelte, astro, mjs, cjs, mts, cts, scss, sass, less, cs, php, dart, lua, r, scala, ps1, proto, graphql, gql, tf, tfvars, hcl]
          - UTTypeIdentifier: com.excalidraw.excalidraw
            UTTypeDescription: Excalidraw Drawing
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
          - UTTypeIdentifier: local.orangelen.har
            UTTypeDescription: HTTP Archive
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [har]
          - UTTypeIdentifier: local.orangelen.jsonl
            UTTypeDescription: JSON Lines
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [jsonl, ndjson]
          - UTTypeIdentifier: local.orangelen.diff
            UTTypeDescription: Unified Diff
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [diff, patch]
          - UTTypeIdentifier: local.orangelen.notebook
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ipynb]
          - UTTypeIdentifier: local.orangelen.sqlite
            UTTypeDescription: SQLite Database
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sqlite, sqlite3, db]

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen
        CODE_SIGN_ENTITLEMENTS: App/OrangeLen.entitlements
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenPreview
        embed: true
      - target: OrangeLenPreviewMarkdown
        embed: true
      - target: OrangeLenPreviewData
        embed: true
      - target: OrangeLenPreviewFolders
        embed: true
      - target: OrangeLenPreviewArchives
        embed: true
      - target: OrangeLenPreviewBooks
        embed: true
      - target: OrangeLenPreviewDrawings
        embed: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Code
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · Code
        OrangeLenPreviewCategory: Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.plain-text, public.source-code, public.swift-source, public.python-script, public.javascript-source, public.c-source, public.c-plus-plus-source, public.shell-script, public.make-source, local.orangelen.developer-source]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreviewMarkdown:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Markdown
    info:
      path: PreviewExtension/Generated/Markdown-Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · Markdown & Notebooks
        OrangeLenPreviewCategory: Markdown
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown, com.unknown.md, local.orangelen.notebook]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview.Markdown
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreviewData:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Data
    info:
      path: PreviewExtension/Generated/Data-Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · Structured Data
        OrangeLenPreviewCategory: Data
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.json, public.xml, public.yaml, public.toml, public.comma-separated-values-text, public.tab-separated-values-text, public.database, local.orangelen.jsonl, local.orangelen.diff, local.orangelen.sqlite, local.orangelen.har, local.orangelen.jsonc, local.orangelen.json5]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview.Data
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreviewFolders:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Folders
    info:
      path: PreviewExtension/Generated/Folders-Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · Folders
        OrangeLenPreviewCategory: Folders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.folder]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview.Folders
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreviewArchives:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Archives
    info:
      path: PreviewExtension/Generated/Archives-Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · Archives & Compressed Text
        OrangeLenPreviewCategory: Archives
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.zip-archive, public.tar-archive, org.gnu.gnu-zip-archive]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview.Archives
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreviewBooks:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Books
    info:
      path: PreviewExtension/Generated/Books-Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · EPUB Books
        OrangeLenPreviewCategory: Books
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [org.idpf.epub-container]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview.Books
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenPreviewDrawings:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes: [PreviewViewController.swift]
      - path: PreviewExtension/Localization/Drawings
    info:
      path: PreviewExtension/Generated/Drawings-Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen · SVG & Excalidraw
        OrangeLenPreviewCategory: Drawings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.excalidraw.excalidraw, public.svg-image]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Preview.Drawings
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/OrangeLenPreview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenUI
      - target: OrangeLenImageBroker
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenImageBroker:
    type: xpc-service
    platform: macOS
    sources:
      - ImageBroker
      - Packages/OrangeLen/Sources/OrangeLenUI/RemoteImageLoader.swift
    info:
      path: ImageBroker/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen Image Broker
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.ImageBroker
        CODE_SIGN_ENTITLEMENTS: ImageBroker/ImageBroker.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenCore

  OrangeLenDocumentBroker:
    type: xpc-service
    platform: macOS
    sources: [DocumentBroker]
    info:
      path: DocumentBroker/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen Document Broker
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.DocumentBroker
        CODE_SIGN_ENTITLEMENTS: DocumentBroker/DocumentBroker.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrangeLen
        product: OrangeLenCore

  OrangeLenTestHost:
    type: application
    platform: macOS
    sources: [Tests/Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.TestHost
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Packages/OrangeLen/Tests/OrangeLenUITests/SystemPreviewTests.swift
      - path: Tests/Fixtures/system-preview
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.NativeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrangeLenTestHost.app/Contents/MacOS/OrangeLenTestHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: OrangeLenTestHost
      - package: OrangeLen
        product: OrangeLenUI
      - package: OrangeLen
        product: OrangeLenCore

schemes:
  OrangeLenNativeTests:
    build:
      targets:
        OrangeLenTestHost: all
        OrangeLenNativeTests: [test]
    test:
      targets: [OrangeLenNativeTests]
  OrangeLen:
    build:
      targets:
        OrangeLen: all
