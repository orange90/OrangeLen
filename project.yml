        SKIP_INSTALL: YES
    dependencies:
      - target: OrangeLenResources
        embed: false
      - package: OrangeLen
        product: OrangeLenCore

  OrangeLenDocumentBroker:
    templates: [SharedResourceConsumer]
    type: xpc-service
    platform: macOS
    sources: [DocumentBroker]
    info:
      path: DocumentBroker/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: OrangeLen Document Broker
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.DocumentBroker
        CODE_SIGN_ENTITLEMENTS: DocumentBroker/DocumentBroker.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - target: OrangeLenResources
        embed: false
      - package: OrangeLen
        product: OrangeLenCore

  OrangeLenTestHost:
    templates: [SharedResourceConsumer]
    type: application
    platform: macOS
    sources: [Tests/Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.TestHost
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OrangeLenResources
        embed: true
        codeSign: true
      - target: OrangeLenDocumentBroker
        embed: true
        codeSign: true
  OrangeLenNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Packages/OrangeLen/Tests/OrangeLenUITests/SystemPreviewTests.swift
      - Packages/OrangeLen/Tests/OrangeLenUITests/AdvancedPreviewTests.swift
      - Packages/OrangeLen/Tests/OrangeLenUITests/SourceParityPreviewTests.swift
      - Packages/OrangeLen/Tests/OrangeLenUITests/ExtendedArchivePreviewTests.swift
      - path: Tests/Fixtures/advanced-outputs
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/system-preview
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.NativeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrangeLenTestHost.app/Contents/MacOS/OrangeLenTestHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: OrangeLenTestHost
      - package: OrangeLen
        product: OrangeLenUI
      - package: OrangeLen
        product: OrangeLenCore

schemes:
  OrangeLenNativeTests:
    build:
      targets:
        OrangeLenTestHost: all
        OrangeLenNativeTests: [test]
    test:
      targets: [OrangeLenNativeTests]
  OrangeLen:
    build:
      targets:
        OrangeLen: all
