name: OrangeLen
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans, Base]
  deploymentTarget:
    macOS: '14.0'
packages:
  OrangeLen:
    path: Packages/OrangeLen
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_DEBUG_DYLIB: NO
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
targetTemplates:
  SharedResourceConsumer:
    sources: [SharedResourcesBootstrap.m]
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/../Frameworks", "@loader_path/../../../../Frameworks", "@loader_path/../../../../../../../Frameworks"]
targets:
  OrangeLenResources:
    type: framework
    platform: macOS
    sources:
      - path: SharedResources
      - path: Packages/OrangeLen/Sources/OrangeLenCore/Resources
        buildPhase: resources
      - path: Packages/OrangeLen/Sources/OrangeLenUI/Resources
        buildPhase: resources
    info:
      path: SharedResources/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.OrangeLen.Resources
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OrangeLen:
    templates: [SharedResourceConsumer]
    type: application
    platform: macOS
    sources:
      - path: App
      - path: scripts/prefer-mesh-preview.sh
        buildPhase: resources
    postBuildScripts:
      - name: Share read-only package resources
        script: /usr/bin/python3 "$SRCROOT/scripts/deduplicate-resources.py" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        basedOnDependencyAnalysis: false
    resources:
      - path: docs/licenses
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleDisplayName: OrangeLen
        CFBundleIconFile: OrangeLen.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 OrangeLen contributors
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.orangelen.xmp
            UTTypeDescription: XMP Metadata
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [xmp]
          - UTTypeIdentifier: local.orangelen.diagram
            UTTypeDescription: Draw.io and JSON Canvas
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [dot, gv, drawio, canvas]
          - UTTypeIdentifier: local.orangelen.component
            UTTypeDescription: React Component
            UTTypeConformsTo: [public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [jsx, tsx]
          - UTTypeIdentifier: local.orangelen.typesetting
            UTTypeDescription: MDX and Typesetting Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mdx, tex, typ]
          - UTTypeIdentifier: local.orangelen.scientific
            UTTypeDescription: Scientific Data and Model Metadata
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [arrow, ipc, feather, onnx, c2pa, npy, parquet, safetensors, gguf, latent]
          - UTTypeIdentifier: local.orangelen.mesh
            UTTypeDescription: 3D Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [obj, stl, gltf, glb]
          - UTTypeIdentifier: local.orangelen.numpy-archive
            UTTypeDescription: NumPy Array Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [npz]
          - UTTypeIdentifier: local.orangelen.n8n-package
            UTTypeDescription: n8n Package
            UTTypeConformsTo: [public.data, public.archive, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [n8np]
          - UTTypeIdentifier: local.orangelen.mermaid
            UTTypeDescription: Mermaid Diagram
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mmd, mermaid]
          - UTTypeIdentifier: local.orangelen.subtitle
            UTTypeDescription: Subtitle File
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [srt, vtt]
          - UTTypeIdentifier: local.orangelen.mcpb
